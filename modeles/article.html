<!doctype html>
<!-- Article template. RULE: a new post is born in 9 languages (fr = canonical <slug>.html, then <slug>.en.html, .es, .it,
     .ru, .ar, .ja, .zh, .id), or the missing ones are listed in a ticket that says so. Checklist, all in the same pull request:
       1. copy this file to site/blog/<slug>.html (French), fill TITLE / DATE / the body; for each other language copy it to
          site/blog/<slug>.<lang>.html and translate it (set lang, title, og:*, and window.__ARTICLE below to that language;
          Arabic also takes dir="rtl" on <html>, see brixhub.ar.html);
       2. in site/index.html add one <li> to #posts (newest first), with data-post="<slug>" and data-langs listing the
          languages that exist, and the title as <span data-i="post_<slug>">;
       3. in site/i18n.js add "post_<slug>" to the en, fr, es, it, ru, ar, ja, zh and id blocks (the title as shown in each
          translation), and raise the ?v= of i18n.js in site/index.html. A language without a translation falls back to the
          French title, and the link goes to the French page;
       4. if the post has interactive scripts with their own text, translate them too (see site/blog/ombres-txt.js).
     Markdown: write it, convert once (pandoc -f markdown -t html), paste the HTML between the <article> tags. -->
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TITLE · Alexandre Pinoteau</title>
<meta name="theme-color" content="#0e121c">
<meta property="og:type" content="article">
<meta property="og:title" content="TITLE">
<meta property="og:locale" content="fr_FR">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="preload" href="../fonts/bricolage.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../style.css">
<script>window.__ARTICLE={slug:"SLUG",lang:"fr",langs:["fr","en","es","it","ru","ar","ja","zh","id"]};</script>
<script src="blog-i18n.js"></script>
</head>
<body class="post">
<header class="bar solid">
  <a class="mark" href="../#blog" aria-label="Alexandre Pinoteau">AP<span class="dot">.</span></a>
  <nav><a href="../#blog">← blog</a></nav>
  <label class="lang"><span class="sr">Langue</span><select id="blog-lang" aria-label="Langue"></select></label>
</header>
<main class="sec prose">
  <p class="meta"><time datetime="2026-01-31">31.01.2026</time></p>
  <h1>TITLE</h1>
  <article>
    <p>First paragraph.</p>
  </article>
</main>
<footer class="foot"><div class="foot-row"><a href="../#blog">← blog</a></div></footer>
</body>
</html>
